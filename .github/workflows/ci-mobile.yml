# CI de la app móvil (Flutter) de LexiEC.
#
# Analiza el formato, el código y ejecuta las pruebas de mobile/ en cada push o
# pull request que toque la app. No compila ni publica el APK (eso es la entrega
# de Release). No usa secretos.

name: CI móvil

on:
  push:
    branches: ['**']
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Misma versión registrada en docs/ESTADO.md.
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Descargar las dependencias
        run: flutter pub get

      - name: Comprobar el formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analizar el código
        run: flutter analyze

      - name: Ejecutar las pruebas
        run: flutter test
